services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotedrive
      POSTGRES_PASSWORD: quotedrive_dev_password
      POSTGRES_DB: quotedrive
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotedrive -d quotedrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      POSTGRES_USER: quotedrive
      POSTGRES_PASSWORD: quotedrive_dev_password
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: quotedrive
      # AI drafting: FakeProvider unless configured (see README "Turn on AI drafting").
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      AI_RETRY_BACKOFF_SECONDS: ${AI_RETRY_BACKOFF_SECONDS:-1}
    extra_hosts:
      # Lets the container reach Ollama on the host (needed on Linux).
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres_data:
