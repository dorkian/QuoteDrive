services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotedrive
      POSTGRES_PASSWORD: quotedrive_dev_password
      POSTGRES_DB: quotedrive
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotedrive -d quotedrive"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      POSTGRES_USER: quotedrive
      POSTGRES_PASSWORD: quotedrive_dev_password
      POSTGRES_SERVER: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: quotedrive
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres_data:
