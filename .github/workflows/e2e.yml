name: E2E

# Manual-only for now (PO decision 2026-09-26). Re-enable on pull_request/push
# to main at the end of the sprint — see the "Enable E2E in CI" Trello card.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Fresh-clone smoke: the stack must come up from a clean checkout.
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health && exit 0; sleep 2; done
          exit 1
      - name: Migrate and seed
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api python -m scripts.seed_demo
          docker compose exec -T api python -m scripts.seed_e2e
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Wait for web
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5173 >/dev/null && exit 0; sleep 2; done
          exit 1
      - name: Run E2E
        working-directory: apps/web
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
